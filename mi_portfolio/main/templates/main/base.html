<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
    {% load static %}

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Home portfolio</title>

    {% load cache_bust %}

    <link href="{% static_versioned 'css/main.css' %}"
          rel="stylesheet"
          type="text/css">

    <!-- Bootstrap 4.3.1 -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
          crossorigin="anonymous">
</head>

<body data-translate-page>

    <canvas id="background"></canvas>

    {% block content %}
    {% endblock %}


    <!-- JavaScript propio -->
    <script src="{% static 'js/dark.js' %}"></script>
    <script src="{% static 'js/translate.js' %}"></script>
    <script src="{% static_versioned 'js/particles.js' %}"></script>
    <script src="{% static_versioned 'js/about.js' %}"></script>


    <!-- Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
            integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
            crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
            integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
            crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
            integrity="sha384-JjSmVgydp3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGZIx4x0xIM+B07jRM"
            crossorigin="anonymous"></script>

</body>
</html>
