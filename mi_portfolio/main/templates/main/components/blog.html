{% load static %}
<section id="blog">
    <div class="titles">
        <h1>BLOG</h1>
    </div>
    {% for post in posts %}
    <div class="container d-flex flex justify-content-center">
        <div class="card about">
            <div class="container flex">
                <div class="post-image justify-content-center">
                    {% if post.image %}
                        <img class="project-image" src="{{ post.image.url }}" alt="{{ post.title }}">
                    {% endif %}
                </div>
                <div>
                    <h2>{{ post.title }}</h2>
                    <p>{{ post.description }}</p>

                    {% if post.linkedin %}
                        <a class="btn-lg" href="{{ post.linkedin }}" target="_blank">Ver en LinkedIn</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
    {% empty %}
    <p>Todavía no hay publicaciones cargadas.</p>
    {% endfor %}
</section>
